<div class="contact-container">
  <app-header></app-header>
  <div class="sidebar">
    <ul>
      @for (item of items; track $index) {
        <li>
          @if (item.url) {
            <a [href]="item.url" target="_blank">{{ item.text }}</a>
          } @else {
            {{ item.text }}
          }
        </li>
      }
    </ul>
  </div>
</div>
